<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Buckeye Vault</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <h1>Buckeye Vault Admin</h1>
            <p>Upload & Manage Game Archives</p>
        </div>
        <nav>
            <a href="/" class="nav-btn">Back to Site</a>
        </nav>
    </header>

    <main class="container admin-container">
        <div class="upload-card">
            <h2>Upload New Video</h2>
            <form id="uploadForm" onsubmit="uploadVideo(event)">
                <div class="form-group">
                    <label>Video Title</label>
                    <input type="text" id="title" required placeholder="e.g., 2024 Ohio State vs Michigan Full Game">
                </div>
                <div class="form-group">
                    <label>Opponent</label>
                    <input type="text" id="opponent" required placeholder="e.g., Michigan">
                </div>
                <div class="form-group">
                    <label>Season Year</label>
                    <input type="number" id="season" required value="2024">
                </div>
                <div class="form-group">
                    <label>Game Date</label>
                    <input type="date" id="gameDate" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category" required>
                        <option value="Full Games">Full Games</option>
                        <option value="Highlights">Highlights</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Video File (MP4)</label>
                    <input type="file" id="videoFile" accept="video/mp4" required>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Upload to Cloudflare R2</button>
            </form>
            <div id="uploadStatus" class="status-msg"></div>
        </div>

        <div class="manage-section">
            <h2>Manage Existing Videos</h2>
            <div id="adminVideoList" class="admin-video-list"></div>
        </div>
    </main>

    <script>
        async function loadAdminVideos() {
            const res = await fetch('/api/videos', { credentials: 'include' });
            const videos = await res.json();
            const list = document.getElementById('adminVideoList');
            list.innerHTML = '';

            videos.forEach(video => {
                const item = document.createElement('div');
                item.className = 'admin-video-item';
                item.innerHTML = `
                    <div>
                        <strong>${video.title}</strong> (${video.season}) - <em>${video.category}</em>
                    </div>
                    <button onclick="deleteVideo('${video.id}')" class="delete-btn">Delete</button>
                `;
                list.appendChild(item);
            });
        }

        async function uploadVideo(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('uploadStatus');
            btn.disabled = true;
            status.innerText = 'Uploading video file to Cloudflare R2 (this may take a few minutes for large files)...';

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('opponent', document.getElementById('opponent').value);
            formData.append('season', document.getElementById('season').value);
            formData.append('gameDate', document.getElementById('gameDate').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('videoFile', document.getElementById('videoFile').files[0]);

            try {
                const res = await fetch('/api/admin/upload', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                const data = await res.json();

                if (res.ok) {
                    status.innerText = 'Upload successful!';
                    document.getElementById('uploadForm').reset();
                    loadAdminVideos();
                } else {
                    status.innerText = `Error: ${data.error}`;
                }
            } catch (err) {
                status.innerText = 'Upload failed due to network error.';
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteVideo(id) {
            if (!confirm('Are you sure you want to delete this video?')) return;
            const res = await fetch(`/api/admin/video/${id}`, { 
                method: 'DELETE',
                credentials: 'include'
            });
            if (res.ok) {
                loadAdminVideos();
            } else {
                alert('Failed to delete video.');
            }
        }

        loadAdminVideos();
    </script>
</body>
</html>
